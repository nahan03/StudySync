# Render Blueprint: New + > Blueprint, pick this repo, and Render creates the web service.
# The database is external (Neon free Postgres), its connection string goes in DATABASE_URL.
# The free plan is fine for trying it out; for real users switch to a paid plan (the free web service sleeps when idle).
services:
  - type: web
    name: studysync
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn StudySync.wsgi --log-file -
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # paste the Postgres connection string (e.g. from Neon) in the Render dashboard; never stored in git
      - key: DATABASE_URL
        sync: false
      # the default *.onrender.com address; add your own domain here later, comma separated
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      # paste your Groq key in the Render dashboard; it is never stored in git
      - key: GROQ_API_KEY
        sync: false
