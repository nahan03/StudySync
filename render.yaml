# Render Blueprint: New + > Blueprint, pick this repo, and Render creates the web service and the database.
# The free plans are fine for trying it out; for real users switch both plans to paid ones
# (the free web service sleeps when idle, and the free database is time-limited).
databases:
  - name: studysync-db
    plan: free
    databaseName: studysync
    user: studysync

services:
  - type: web
    name: studysync
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn StudySync.wsgi --log-file -
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: studysync-db
          property: connectionString
      # the default *.onrender.com address; add your own domain here later, comma separated
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      # paste your Groq key in the Render dashboard; it is never stored in git
      - key: GROQ_API_KEY
        sync: false
