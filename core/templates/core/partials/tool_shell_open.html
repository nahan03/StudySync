<script>
/* follow the look chosen on the Study page */
(function () {
  try {
    var p = JSON.parse(localStorage.getItem('studySyncStudyPrefs') || '{}'), r = document.getElementById('st-root');
    if (p.theme) r.dataset.theme = p.theme;
  } catch (e) { /* storage unavailable */ }
})();
</script>
