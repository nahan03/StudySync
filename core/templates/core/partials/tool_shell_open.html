<div class="st-root tool-root" id="st-root" data-theme="lamp" data-bg="lamp">
<script>
/* follow the look chosen on the Study page */
(function () {
  try {
    var p = JSON.parse(localStorage.getItem('studySyncStudyPrefs') || '{}'), r = document.getElementById('st-root');
    r.dataset.theme = window.ssTheme ? window.ssTheme(p) : (p.theme || 'lamp');
  } catch (e) { /* storage unavailable */ }
})();
</script>
